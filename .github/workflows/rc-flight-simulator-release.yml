name: RC Flight Simulator builds

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "rc-flight-lab-v*"

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2
  GODOT_STATUS: stable
  PROJECT_DIR: .
  RELEASE_BASE: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable

jobs:
  macos:
    name: macOS Universal
    runs-on: macos-14
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build universal JSBSim extension
        run: |
          cmake -S "$PROJECT_DIR/native" -B "$PROJECT_DIR/native/build-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGODOTCPP_TARGET=template_release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build "$PROJECT_DIR/native/build-release" --target rcflight_jsbsim
          lipo -info "$PROJECT_DIR/native/bin/librcflight_jsbsim.dylib"
      - name: Install Godot and export templates
        run: |
          curl -L "$RELEASE_BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_macos.universal.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          curl -L "$RELEASE_BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o /tmp/templates.zip
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q /tmp/templates.zip -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
      - name: Test and export
        run: |
          GODOT=/tmp/godot/Godot.app/Contents/MacOS/Godot
          "$GODOT" --headless --path "$PROJECT_DIR" --import
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/rascal_ground_stability.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/rascal_reset_determinism.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/reset_camera_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/takeoff_camera_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/rascal_visual_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/aircraft_selection_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/juggy_tuning_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/juggy_takeoff_distance_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/juggy_takeoff_smoothness.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/panorama_seam_smoke.gd
          mkdir -p "$PROJECT_DIR/builds/macos"
          "$GODOT" --headless --path "$PROJECT_DIR" --export-release "macOS Universal" "builds/macos/RC Flight Lab.app"
      - name: Require Apple credentials for releases
        if: startsWith(github.ref, 'refs/tags/rc-flight-lab-v')
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_KEYCHAIN_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required repository secret $name is not configured"
              missing=1
            fi
          done
          exit "$missing"
      - name: Import Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/rc-flight-lab-v')
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ ! "$SIGNING_IDENTITY" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::No Developer ID Application identity was found in the imported P12"
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
      - name: Sign, notarize, and staple macOS app
        if: startsWith(github.ref, 'refs/tags/rc-flight-lab-v')
        run: |
          APP_PATH="$PROJECT_DIR/builds/macos/RC Flight Lab.app"
          NOTARY_ZIP="$RUNNER_TEMP/RC-Flight-Lab-notary.zip"
          find "$APP_PATH/Contents/Frameworks" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' library; do
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" "$library"
          done
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" --wait \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"
      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$PROJECT_DIR/builds/macos/RC Flight Lab.app" \
            "$PROJECT_DIR/builds/RC-Flight-Lab-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: RC-Flight-Lab-macOS
          path: builds/RC-Flight-Lab-macOS.zip

  windows:
    name: Windows x86-64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build JSBSim extension
        shell: pwsh
        run: |
          cmake -S "$env:PROJECT_DIR/native" -B "$env:PROJECT_DIR/native/build-release" -G Ninja -DCMAKE_BUILD_TYPE=Release -DGODOTCPP_TARGET=template_release
          cmake --build "$env:PROJECT_DIR/native/build-release" --target rcflight_jsbsim
      - name: Install Godot and export templates
        shell: pwsh
        run: |
          Invoke-WebRequest "$env:RELEASE_BASE/Godot_v$env:GODOT_VERSION-$env:GODOT_STATUS`_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot"
          Invoke-WebRequest "$env:RELEASE_BASE/Godot_v$env:GODOT_VERSION-$env:GODOT_STATUS`_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.zip"
          Expand-Archive "$env:RUNNER_TEMP/templates.zip" "$env:RUNNER_TEMP/templates"
          $templateDir = "$env:APPDATA/Godot/export_templates/$env:GODOT_VERSION.$env:GODOT_STATUS"
          New-Item -ItemType Directory -Force $templateDir | Out-Null
          Copy-Item "$env:RUNNER_TEMP/templates/templates/*" $templateDir -Recurse -Force
      - name: Test and export
        shell: pwsh
        run: |
          $godot = Get-ChildItem "$env:RUNNER_TEMP/godot/Godot*.exe" | Select-Object -First 1
          & $godot.FullName --headless --path $env:PROJECT_DIR --import
          & $godot.FullName --headless --path $env:PROJECT_DIR --script res://tests/rascal_ground_stability.gd
          & $godot.FullName --headless --path $env:PROJECT_DIR --script res://tests/rascal_reset_determinism.gd
          & $godot.FullName --headless --path $env:PROJECT_DIR --script res://tests/reset_camera_smoke.gd
          & $godot.FullName --headless --path $env:PROJECT_DIR --script res://tests/takeoff_camera_smoke.gd
          & $godot.FullName --headless --path $env:PROJECT_DIR --script res://tests/rascal_visual_smoke.gd
          & $godot.FullName --headless --path $env:PROJECT_DIR --script res://tests/aircraft_selection_smoke.gd
          & $godot.FullName --headless --path $env:PROJECT_DIR --script res://tests/juggy_tuning_smoke.gd
          & $godot.FullName --headless --path $env:PROJECT_DIR --script res://tests/juggy_takeoff_distance_smoke.gd
          & $godot.FullName --headless --path $env:PROJECT_DIR --script res://tests/juggy_takeoff_smoothness.gd
          & $godot.FullName --headless --path $env:PROJECT_DIR --script res://tests/panorama_seam_smoke.gd
          New-Item -ItemType Directory -Force "$env:PROJECT_DIR/builds/windows" | Out-Null
          & $godot.FullName --headless --path $env:PROJECT_DIR --export-release "Windows x86-64" builds/windows/RC-Flight-Lab.exe
          Compress-Archive "$env:PROJECT_DIR/builds/windows/*" "$env:PROJECT_DIR/builds/RC-Flight-Lab-Windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: RC-Flight-Lab-Windows-x86_64
          path: builds/RC-Flight-Lab-Windows-x86_64.zip

  raspberry_pi:
    name: Raspberry Pi ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build JSBSim extension
        run: |
          cmake -S "$PROJECT_DIR/native" -B "$PROJECT_DIR/native/build-release" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DGODOTCPP_TARGET=template_release
          cmake --build "$PROJECT_DIR/native/build-release" --target rcflight_jsbsim
      - name: Install Godot and export templates
        run: |
          curl -L "$RELEASE_BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.arm64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.arm64
          curl -L "$RELEASE_BASE/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          unzip -q /tmp/templates.zip -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}/"
      - name: Test and export
        run: |
          GODOT=/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.arm64
          "$GODOT" --headless --path "$PROJECT_DIR" --import
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/rascal_ground_stability.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/rascal_reset_determinism.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/reset_camera_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/takeoff_camera_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/rascal_visual_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/aircraft_selection_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/juggy_tuning_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/juggy_takeoff_distance_smoke.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/juggy_takeoff_smoothness.gd
          "$GODOT" --headless --path "$PROJECT_DIR" --script res://tests/panorama_seam_smoke.gd
          mkdir -p "$PROJECT_DIR/builds/raspberry-pi"
          "$GODOT" --headless --path "$PROJECT_DIR" --export-release "Raspberry Pi ARM64" builds/raspberry-pi/RC-Flight-Lab.arm64
          chmod +x "$PROJECT_DIR/builds/raspberry-pi/RC-Flight-Lab.arm64"
          tar -C "$PROJECT_DIR/builds/raspberry-pi" -czf "$PROJECT_DIR/builds/RC-Flight-Lab-Raspberry-Pi-arm64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: RC-Flight-Lab-Raspberry-Pi-arm64
          path: builds/RC-Flight-Lab-Raspberry-Pi-arm64.tar.gz

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/rc-flight-lab-v')
    needs: [macos, windows, raspberry_pi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
